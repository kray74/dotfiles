# vim:ft=kitty

## name: Adwaita dark
## author: Vasiliy Biryukov (https://github.com/kray74)
## license: GPLv3
## blurb: libadwaita inspired theme

foreground #ffffff
background #1d1d20

cursor #ffffff
cursor_text_color #1d1d20
cursor_trail_color none

selection_foreground #ffffff
selection_background #3584e4

url_color #81d0ff

visual_bell_color none

scrollbar_handle_color foreground
scrollbar_track_color #58585b

inactive_border_color #3a3a3c
active_border_color #3584e4
bell_border_color #ffc252

window_title_bar_active_foreground #ffffff
window_title_bar_active_background #58585b
window_title_bar_inactive_foreground #ffffff
window_title_bar_inactive_background #2e2e32

active_tab_foreground #ffffff
active_tab_background #58585b
inactive_tab_foreground #ffffff
inactive_tab_background #2e2e32

