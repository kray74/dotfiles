# Fonts
font_family JetBrains Mono
include nerd-fonts.conf

include adwaita.conf

disable_ligatures cursor

# contrast WCAG level AA
#text_fg_override_threshold 4.5 ratio

# Cursor
cursor_trail 50
#TODO: 0.49 custom_shaders cursor-trail-railgun, cursor-trail-torpedo, cursor-trail-pixiedust

# Scrollback
#TODO: 0.49 scrollbar scrolled-or-hovered
wheel_scroll_multiplier 3

# Mouse
show_hyperlink_targets yes
#TODO: 0.50 hyperlink_target_position tooltip
strip_trailing_spaces always
# disable drag&drop for tabs and windows
drag_threshold 0

#TODO: 0.50 mouse_map ctrl+wheel_up press ungrabbed,grabbed change_font_size all +1
#TODO: 0.50 mouse_map ctrl+wheel_down press ungrabbed,grabbed change_font_size all -1

# Terminal bell
enable_audio_bell no
visual_bell_duration 0.5
bell_on_tab 🔔

# Window layout
confirm_os_window_close -1 count-background

# Tab bar
#TODO: 0.50 tab.program_status
tab_activity_symbol ⏳
#TODO: 0.50 add tab.program_status
tab_title_template "{bell_symbol}{activity_symbol}{tab.progress_percent}{title}"

# Color scheme
#background_opacity 0.9
#background_blur 1
palette_generate semantic

# Advanced
editor nvim
#TODO: 0.49 custom_shaders
update_check_interval 0
notify_on_cmd_finish unfocused 10 bell
notify_on_cmd_finish invisible 10 notify


# Keyboard shortcuts
map kitty_mod+f1 command_palette

# Markers
map ctrl+/ create_marker
map ctrl+shift+/ remove_marker
map ctrl+shift+n scroll_to_mark prev
map ctrl+n scroll_to_mark next

# Open new tab with the current working directory by default
map kitty_mod+t new_tab
map kitty_mod+alt+t new_tab_with_cwd

# Increase font size
map kitty_mod+equal       change_font_size all +1.0
map kitty_mod+plus        change_font_size all +1.0
map kitty_mod+kp_add      change_font_size all +1.0

# Decrease font size
map kitty_mod+minus       change_font_size all -1.0
map kitty_mod+kp_subtract change_font_size all -1.0

map ctrl+h previous_tab
map ctrl+j scroll_to_prompt 1
map ctrl+k scroll_to_prompt -1
map ctrl+l next_tab

map kitty_mod+h move_tab_backward
map kitty_mod+l move_tab_forward

